# Load-scaling pilot (IMPLEMENTATION_PLAN.md §11): N made-up commands, each meaning "add c" (mod 13),
# bound in one prompt; queries on 8 of them. Same models/optimiser as base.yaml except batch size.
inherit: base.yaml
data:
  task: recall
  n_choices: [4, 8, 16, 32, 64, 128]
  n_query: 8
  p_definition: 0.25
  num_workers: 0   # main-process generation (6 ms/batch); lab CPU quota is 6 for all of eric
  val_file: data/recall/val.jsonl
  test_file: data/recall/test.jsonl
  val_per_cell: 25
  test_per_cell: 250
train:
  batch_size: 64
